<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Antilatency tracking</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #1a1a1a; font-family: monospace; }
        #info { 
            position: absolute; top: 10px; left: 10px; 
            color: #00ff00; background: rgba(0,0,0,0.8); 
            padding: 10px; border-radius: 4px; pointer-events: none; 
        }
        .tracker-row { margin-top: 5px; color: white; border-left: 3px solid; padding-left: 5px; }
    </style>
    
    <script async src="https://unpkg.com/es-module-shims@1.6.3/dist/es-module-shims.js"></script>
    <script type="importmap">
      { "imports": { "three": "https://unpkg.com/three@0.154.0/build/three.module.js" } }
    </script>
    
    <script src="/socket.io/socket.io.js"></script>
</head>
<body>

<div id="info">
    <div>Status: <span id="status">Connecting...</span></div>
    <div id="tracker-list"></div>
</div>

<script type="module">
    import * as THREE from 'three';

     let mapping = null;

    async function loadMapping() {
        const res = await fetch('/assets/mapping.json');
        mapping = await res.json();
        console.log('✅ Mapping loaded:', mapping);
    }

    await loadMapping();

     function getSeasonFromPosition(x, y) {
        if (x >= 0 && y >= 0) return 'summer';
        if (x < 0 && y < 0) return 'winter';
        if (x >= 0 && y < 0) return 'spring';
        if (x < 0 && y >= 0) return 'autumn';
    }

    function getRandomImageForSeason(season) {
        if (!mapping?.seasons?.[season]) return null;
        const images = mapping.seasons[season].images;
        return images[Math.floor(Math.random() * images.length)];
    }

    
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x202020);
    
    const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.01, 100);
    camera.position.set(0, 3, 3);
    camera.lookAt(0, 0, 0);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    document.body.appendChild(renderer.domElement);

    const grid = new THREE.GridHelper(10, 10, 0x555555, 0x333333);
    scene.add(grid);
    scene.add(new THREE.AxesHelper(0.5));

    const light = new THREE.DirectionalLight(0xffffff, 1);
    light.position.set(2, 5, 2);
    scene.add(light);
    scene.add(new THREE.AmbientLight(0xffffff, 0.6));

    const trackers = {};
    const listEl = document.getElementById('tracker-list');

    function stringToColor(str) {
        let hash = 0;
        for (let i = 0; i < str.length; i++) {
            hash = str.charCodeAt(i) + ((hash << 5) - hash);
        }
        const h = Math.abs((hash * 137.5) % 360) / 360; 
        return new THREE.Color().setHSL(h, 0.75, 0.5);
    }

    function createTrackerMesh(idString) {
        const group = new THREE.Group();
        const color = stringToColor(idString);

        const box = new THREE.Mesh(
            new THREE.BoxGeometry(0.06, 0.03, 0.1), 
            new THREE.MeshStandardMaterial({ color: color })
        );
        group.add(box);

        const nose = new THREE.Mesh(
            new THREE.BoxGeometry(0.02, 0.02, 0.05),
            new THREE.MeshBasicMaterial({ color: 0xffffff })
        );
        nose.position.z = -0.06;
        group.add(nose);

        scene.add(group);
        return { mesh: group, color: color.getHexString() };
    }

    const socket = io(); // connect to localhost:3000
    const statusEl = document.getElementById('status');

    socket.on('connect', () => {
        statusEl.innerText = "Connected";
        statusEl.style.color = "#00ff00";
    });

    socket.on('disconnect', () => {
        statusEl.innerText = "Disconnected";
        statusEl.style.color = "#ff0000";
    });

    socket.on('tracking_data', (msg) => {
        try {
            const data = JSON.parse(msg);
            const id = data.id;

            if (!trackers[id]) {
                console.log(`New tracker found: ${id}`);
                const { mesh, color } = createTrackerMesh(id);
                trackers[id] = { 
                    mesh: mesh, 
                    color: color,
                    lastSeen: Date.now() 
                };
                
                const div = document.createElement('div');
                div.id = `ui-${id}`;
                div.className = 'tracker-row';
                div.style.borderColor = '#' + color;
                div.innerText = `Node ${id}`;
                listEl.appendChild(div);
            }

            const t = trackers[id];
            t.lastSeen = Date.now();

            t.mesh.position.set(
                data.pose.position.x,
                data.pose.position.y,
                data.pose.position.z
            );

            t.mesh.quaternion.set(
                data.pose.rotation.x,
                data.pose.rotation.y,
                data.pose.rotation.z,
                data.pose.rotation.w
            );

            document.getElementById(`ui-${id}`).innerText = `Node ${id}: [${data.pose.position.x.toFixed(2)}, ${data.pose.position.z.toFixed(2)}, ${data.pose.position.y.toFixed(2)}]`;
        } catch (e) {
            console.error("Parse Error", e);
        }
    });

    setInterval(() => {
        const now = Date.now();
        for (const [id, t] of Object.entries(trackers)) {
            if (now - t.lastSeen > 1500) {
                scene.remove(t.mesh);
                const ui = document.getElementById(`ui-${id}`);
                if (ui) ui.remove();
                delete trackers[id];
                console.log(`Removed inactive tracker: ${id}`);
            }
        }
    }, 1000);

    function animate() {
        requestAnimationFrame(animate);
        renderer.render(scene, camera);
    }
    animate();

    window.addEventListener('resize', () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
    });
</script>
</body>
</html>
