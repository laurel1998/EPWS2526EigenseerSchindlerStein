<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <title>SeasonShift</title>

  <link rel="stylesheet" href="./css/styles.css">

  <script async src="https://unpkg.com/es-module-shims@1.6.3/dist/es-module-shims.js"></script>
  <script type="importmap">
    { "imports": { "three": "https://unpkg.com/three@0.154.0/build/three.module.js" } }
  </script>

  <script src="/socket.io/socket.io.js"></script>
</head>

<body>
  <div id="split">
    <img id="season-image-left" class="season-image">
    <img id="season-image-right" class="season-image">
  </div>
  
  <div id="meta-bar" class="meta-split">
    <div class="meta-col left">
      <div class="meta-top">
        <span id="meta-date-left">--/--/----</span>
        <span class="meta-divider"></span>
        <span id="meta-time-left">--:--</span>
      </div>
      <div class="name">KTDS-Labor</div>
    </div>

    <div class="meta-col right">
      <div class="meta-top">
        <span id="meta-date-right">--/--/----</span>
        <span class="meta-divider"></span>
        <span id="meta-time-right">--:--</span>
      </div>
      <div class="name">KTDS-Labor</div>
    </div>
  </div>




  <div id="info">
    <div>Status: <span id="status">Connecting...</span></div>
    <div id="tracker-list"></div>
  </div>


  <script type="module" src="./js/main.js"></script>
</body>

</html>
